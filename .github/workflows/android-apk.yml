name: Build Heroes of the Bible APK

'on': [push, workflow_dispatch]

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-24.04
container:
image: barichello/godot-ci:4.7.2

steps:
  - name: Checkout repository
    uses: actions/checkout@v5

  - name: Install Linux dependencies
    run: |
      apt-get update
      apt-get install -y unzip fontconfig

  - name: Extract Godot project
    run: |
      set -eu
      mkdir -p extracted build
      ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)"
      test -n "$ZIP_FILE" || { echo "No ZIP found"; exit 1; }
      unzip -q "$ZIP_FILE" -d extracted
      PROJECT_FILE="$(find extracted -type f -name project.godot -print -quit)"
      test -n "$PROJECT_FILE" || { echo "project.godot not found in ZIP"; exit 1; }
      PROJECT_DIR="$(dirname "$PROJECT_FILE")"
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Project folder: $PROJECT_DIR"

  - name: Check Android preset
    run: |
      test -f "$PROJECT_DIR/export_presets.cfg" || { echo "export_presets.cfg missing"; exit 1; }
      grep -q 'name="Android"' "$PROJECT_DIR/export_presets.cfg" || { echo "Android preset missing"; exit 1; }

  - name: Configure Java and Android SDK
    run: |
      set -eu
      command -v java || { echo "Java is missing"; exit 1; }
      JAVA_BIN="$(readlink -f "$(command -v java)")"
      JAVA_PATH="$(dirname "$(dirname "$JAVA_BIN")")"
      SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
      if [ -z "$SDK_PATH" ] || [ ! -d "$SDK_PATH" ]; then
        for p in /root/android-sdk /opt/android-sdk /usr/local/lib/android/sdk /usr/lib/android-sdk; do
          if [ -d "$p" ]; then SDK_PATH="$p"; break; fi
        done
      fi
      test -d "$SDK_PATH" || { echo "Android SDK directory not found"; exit 1; }
      mkdir -p "$HOME/.config/godot"
      printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/java_sdk_path = "%s"\nexport/android/android_sdk_path = "%s"\n' "$JAVA_PATH" "$SDK_PATH" > "$HOME/.config/godot/editor_settings-4.tres"

  - name: Import and validate project
    run: godot --headless --editor --path "$PROJECT_DIR" --quit

  - name: Export debug APK
    run: godot --headless --path "$PROJECT_DIR" --export-debug "Android" "$GITHUB_WORKSPACE/build/HeroesOfTheBible.apk"

  - name: Upload APK
    uses: actions/upload-artifact@v5
    with:
      name: HeroesOfTheBible-debug-APK
      path: build/HeroesOfTheBible.apk
      if-no-files-found: error
